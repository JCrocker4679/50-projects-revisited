<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src https://icanhazdadjoke.com; img-src 'self'; frame-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <title>Dad Jokes</title>
    <meta name="description" content="Groan-worthy dad jokes on demand. Get a random joke, save your favourites, and share the pain. Free, no sign-up, no ads." />

    <!-- Open Graph -->
    <meta property="og:title" content="Dad Jokes" />
    <meta property="og:description" content="Groan-worthy dad jokes on demand. Get a random joke, save your favourites, and share the pain." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dad Jokes" />
    <meta name="twitter:description" content="Groan-worthy dad jokes on demand. Free, no sign-up, no ads." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme colour for mobile browsers -->
    <meta name="theme-color" content="#686de0" />
  </head>
  <body>
    <main class="container" role="main">
      <h1 class="title">Don't Laugh Challenge</h1>
      <p
        class="joke"
        id="joke"
        aria-live="polite"
        aria-atomic="true"
      >Loading...</p>
      <div class="action-row">
        <button id="jokeBtn" class="btn" type="button">
          Get Another Joke
        </button>
      </div>
      <nav class="history-nav" aria-label="Joke history navigation">
        <button
          id="prevBtn"
          class="btn btn--nav"
          type="button"
          aria-label="Previous joke"
          aria-disabled="true"
          disabled
        >← Prev</button>
        <span class="history-counter" aria-live="polite" hidden></span>
        <button
          id="nextBtn"
          class="btn btn--nav"
          type="button"
          aria-label="Next joke"
          aria-disabled="true"
          disabled
        >Next →</button>
      </nav>
    </main>

    <noscript>
      <p style="text-align: center; padding: 2rem; font-family: sans-serif;">
        This app needs JavaScript to fetch jokes. Please enable JavaScript to continue.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
