<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src https://icanhazdadjoke.com https://va.vercel-insights.com; img-src 'self'; frame-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <title>Dad Jokes</title>
    <meta name="description" content="Groan-worthy dad jokes on demand. Get a random joke, save your favourites, and share the pain. Free, no sign-up, no ads." />

    <!-- Open Graph -->
    <meta property="og:title" content="Dad Jokes" />
    <meta property="og:description" content="Groan-worthy dad jokes on demand. Get a random joke, save your favourites, and share the pain." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dad Jokes" />
    <meta name="twitter:description" content="Groan-worthy dad jokes on demand. Free, no sign-up, no ads." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme colour for mobile browsers -->
    <meta name="theme-color" content="#686de0" />

    <!-- Theme init: applies saved/system preference before paint to prevent FOUC.
         Must be in <head>. Module script is CSP-compliant (no inline scripts). -->
    <script type="module" src="/src/theme-init.ts"></script>
  </head>
  <body>
    <button
      id="themeToggleBtn"
      class="theme-toggle"
      type="button"
      aria-label="Switch to dark mode"
      aria-pressed="false"
    >☾</button>
    <main class="container" role="main">
      <h1 class="title">Don't Laugh Challenge</h1>
      <form id="searchForm" class="search-form" role="search">
        <label for="searchInput" class="sr-only">Search jokes by keyword</label>
        <div class="search-input-row">
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search jokes..."
            autocomplete="off"
          />
          <button id="searchBtn" class="btn search-btn" type="submit" aria-label="Search for jokes">Search</button>
          <button
            id="searchClearBtn"
            class="btn btn--icon search-clear"
            type="button"
            aria-label="Clear search"
            hidden
          >✕</button>
        </div>
      </form>
      <p id="searchMeta" class="search-meta" role="status" aria-live="polite" hidden></p>
      <ul id="searchResults" class="search-results" aria-label="Search results" hidden></ul>
      <p
        class="joke"
        id="joke"
        aria-live="polite"
        aria-atomic="true"
      >Loading...</p>
      <div class="cta-row">
        <button id="jokeBtn" class="btn" type="button">
          Tell me another
        </button>
      </div>
      <div class="icon-row">
        <button
          id="favouriteBtn"
          class="btn btn--icon"
          type="button"
          aria-pressed="false"
          aria-label="Add to favourites"
          title="Add to favourites"
        >★</button>
        <button
          id="thumbsDownBtn"
          class="btn btn--icon"
          type="button"
          aria-label="Rate joke down"
          aria-pressed="false"
          title="Rate joke down"
        >👎</button>
        <button
          id="thumbsUpBtn"
          class="btn btn--icon"
          type="button"
          aria-label="Rate joke up"
          aria-pressed="false"
          title="Rate joke up"
        >👍</button>
        <button
          id="copyBtn"
          class="btn btn--icon"
          type="button"
          aria-label="Copy joke to clipboard"
          title="Copy joke to clipboard"
          disabled
        >📋</button>
        <button
          id="shareBtn"
          class="btn btn--icon"
          type="button"
          aria-label="Share joke"
          title="Share joke"
          disabled
        >↗</button>
      </div>
      <nav class="history-nav" aria-label="Joke history navigation">
        <button
          id="prevBtn"
          class="btn btn--nav"
          type="button"
          aria-label="Previous joke"
          aria-disabled="true"
          disabled
        >← Prev</button>
        <span class="history-counter" aria-live="polite" hidden></span>
        <button
          id="nextBtn"
          class="btn btn--nav"
          type="button"
          aria-label="Next joke"
          aria-disabled="true"
          disabled
        >Next →</button>
      </nav>
      <div class="fav-toggle-row" hidden>
        <button
          id="favListBtn"
          class="btn btn--ghost"
          type="button"
          aria-expanded="false"
          aria-controls="favPanel"
        >My Favourites (<span id="favCount">0</span>)</button>
      </div>
      <section id="favPanel" class="fav-panel" hidden aria-label="Saved favourites">
      </section>
    </main>

    <noscript>
      <p style="text-align: center; padding: 2rem; font-family: sans-serif;">
        This app needs JavaScript to fetch jokes. Please enable JavaScript to continue.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
